{% extends 'encrytor/base.html' %}
{% load static %}
{% block content %}
<h2>login</h2>
    <form method="post" action="">
    <fieldset>
        <legend>로그인정보</legend>
        {% csrf_token %}
        <p>
            <label>아이디</label>
            <input type="id" id="id" placeholder="아이디를 입력해주세요">
        </p>
        <p>
            <label>비밀번호</label>
            <input type="passwd" pw="pw" placeholder="비밀번호를 입력해주세요">
        </p>
        
    </fieldset>
    
    {% if form.errors %}
    <p>아이디 또는 비밀번호가 올바르지 않습니다.</p>
    {% endif %}

    <p><button type="submit">login</button></p>
    </form>

    <!--만약 로그인정보 일치X 다시 로그인 &&
    맞다면 다음페이지 upload페이지로 넘어가기 -->




{% endblock %}
